services:
  mysql:
    image: mysql:8.1
    container_name: movies_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-changeme}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-movies}"
      MYSQL_USER: "${MYSQL_USER:-webuser}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-changeme}"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  catalog_api:
    image: ${CATALOG_API_IMAGE:-ghcr.io/ngramste/movie-library-catalog-api:1.0.0}
    container_name: movies_catalog_api
    restart: unless-stopped
    pull_policy: always
    environment:
      MYSQL_USER: "${MYSQL_USER:-webuser}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-changeme}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-myapp}"
      # Allow writing to the media files to add metadata
      ENABLE_WRITE: "${ENABLE_WRITE:-False}"
      # Drop the entire database and recreate it from scratch
      FULL_REBUILD_DB: "${FULL_REBUILD_DB:-False}"
      # Skip touching the database and just launch the app quickly for development.
      # A True value supersedes both ENABLE_WRITE and FULL_REBUILD_DB skipping both actions
      QUICK_LAUNCH_DEV: "${QUICK_LAUNCH_DEV:-False}"
      ENABLE_CRON_DB_REBUILD: "${ENABLE_CRON_DB_REBUILD:-True}"
      # Cron schedule for rebuilding the database
      CRON_DB_REBUILD_SCHEDULE: "${CRON_DB_REBUILD_SCHEDULE:-0 4 * * *}"

      TZ: "${TZ:-America/Chicago}"

      # Open movie database API key
      OMDB_API_KEY: "${OMDB_API_KEY:-changeme}"
    volumes:
      - ${MOVIES_PATH:-./media/Movies}:/movies
      - posters:/posters
    depends_on:
      mysql:
        condition: service_healthy
    command: python app.py
    networks:
      - app_network

  nginx:
    image: ${WEB_IMAGE:-ghcr.io/ngramste/movie-library-web:1.0.0}
    container_name: movies_nginx
    restart: unless-stopped
    pull_policy: always
    volumes:
      - posters:/usr/share/nginx/html/posters:ro
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - catalog_api
    networks:
      - app_network

volumes:
  mysql_data:
  posters:

networks:
  app_network:
    driver: bridge

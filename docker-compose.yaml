services:
  mysql:
    image: mysql:8.1
    container_name: movies_mysql
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-changeme}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-myapp}"
      MYSQL_USER: "${MYSQL_USER:-webuser}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-changeme}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3306", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: movies_phpmyadmin
    restart: always
    env_file: .env
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - app_network

  catalog_api:
    image: ${CATALOG_API_IMAGE:-movie-library/catalog_api:latest}
    build:
      context: ./catalog_api
      dockerfile: Dockerfile
    container_name: movies_catalog_api
    restart: always
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "${TZ:-America/Chicago}"
    volumes:
      - "${MOVIES_PATH:-./media/Movies}:/movies"
      - posters:/posters
    depends_on:
      - mysql
    command: python app.py
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: movies_nginx
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html
      - posters:/usr/share/nginx/html/posters
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - catalog_api
    networks:
      - app_network

  registry:
    image: registry:2
    container_name: movies_registry
    restart: unless-stopped
    profiles:
      - registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - app_network

volumes:
  mysql_data:
  posters:
  registry_data:

# Custom network for service communication
networks:
  app_network:
    driver: bridge
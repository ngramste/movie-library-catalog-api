version: "3.9"

services:
  mysql:
    image: mysql:8.1
    container_name: movies_mysql
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: movies_phpmyadmin
    restart: always
    env_file: .env
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    ports:
      - "8080:80"
    networks:
      - app_network

  python_app:
    build:
      context: ./python_app
      dockerfile: Dockerfile
    container_name: movies_python_app
    restart: always
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: ${TIMEZONE}
    volumes:
      - ./media/Movies:/movies
      - ./www/posters:/posters
    depends_on:
      - mysql
    command: python app.py
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: movies_nginx
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - python_app
    networks:
      - app_network

volumes:
  mysql_data:

# Custom network for service communication
networks:
  app_network:
    driver: bridge